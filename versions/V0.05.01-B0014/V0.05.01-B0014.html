  var h = '<div class="war-decl" style="min-width:440px;max-width:560px">';
  h += '<div style="font-size:14px;color:#ffce7a;border-bottom:1px solid rgba(255,180,80,.3);padding-bottom:10px;margin-bottom:12px;letter-spacing:3px;text-align:center">';
  h += '⚔ 战 争 预 告 ⚔';
  h += '</div>';

  h += '<div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px">';
  h += '<div style="text-align:center"><div style="color:' + aCol + ';font-size:16px;font-weight:600">' + countries[a].name + '</div><div style="font-size:11px;color:#7d8fa6;margin-top:2px">进攻方</div></div>';
  h += '<div style="color:#7d8fa6;font-size:18px">→ 宣 战 →</div>';
  h += '<div style="text-align:center"><div style="color:' + dCol + ';font-size:16px;font-weight:600">' + countries[d].name + '</div><div style="font-size:11px;color:#7d8fa6;margin-top:2px">防御方</div></div>';
  h += '</div>';

  /* 倒计时 */
  h += '<div style="text-align:center;margin-bottom:14px;font-size:12px;color:#8fa5bb">距离正式宣战还有 <b style="color:#ffce7a;font-size:14px">' + pw.countdown + '</b> 回合（约 ' + Math.max(1, Math.round(pw.countdown/14)) + ' 天）</div>';

  /* 预写评论 */
  h += '<div style="border:1px solid rgba(90,140,200,.2);border-radius:6px;padding:10px;margin-bottom:14px;font-size:11.5px;color:#a5b8cc;line-height:1.8;max-height:140px;overflow-y:auto">';
  h += '<div style="color:#7d8fa6;margin-bottom:6px;letter-spacing:1px">— 各方评论 —</div>';
  for (var ci = 0; ci < pw.comments.length; ci++)
    h += '<div style="margin-bottom:4px">' + pw.comments[ci] + '</div>';
  h += '</div>';

  /* 玩家站队选项（只有当玩家不直接参与时显示站队；否则只显示旁观） */
  if (!isPlayer) {
    h += '<div style="display:flex;gap:8px;margin-bottom:10px">';
    h += '<button class="btn" style="flex:1;background:rgba(255,100,100,.12);border-color:rgba(255,100,100,.35);color:#ffb0b0" onclick="alignWar(' + pw.a + ',' + pw.d + ',\'attacker\')">支持 ' + countries[a].name + '</button>';
    h += '<button class="btn" style="flex:1;background:rgba(100,150,255,.12);border-color:rgba(100,150,255,.35);color:#b0c8ff" onclick="alignWar(' + pw.a + ',' + pw.d + ',\'defender\')">支持 ' + countries[d].name + '</button>';
    h += '<button class="btn amber" style="flex:1" onclick="alignWar(' + pw.a + ',' + pw.d + ',\'neutral\')">保持中立</button>';
    h += '</div>';
  } else {
    h += '<div style="text-align:center;color:#ffce7a;font-size:12px;margin-bottom:10px">你是交战方，请做好战争准备！</div>';
    h += '<div style="display:flex;gap:6px;margin-top:6px">';
    h += '<button class="btn" style="flex:1" onclick="alignWar(' + a + ',' + d + ',\'attacker\')">进攻</button>';
    h += '<button class="btn" style="flex:1" onclick="alignWar(' + a + ',' + d + ',\'defender\')">防御</button>';
    h += '</div>';
  }

  h += '<div style="display:flex;gap:8px">';
  h += '<button class="btn" style="flex:1" onclick="closeWarDecl()">关闭窗口（战争继续）</button>';
  h += '</div>';
  h += '</div>';

  openModal('war-decl', h);
}

function alignWar(a, d, side) {
  for (var i = 0; i < PENDING_WARS.length; i++) {
    var pw = PENDING_WARS[i];
    if (pw.a === a && pw.d === d) {
      pw.playerSide = side;
      if (side === 'attacker') toast('你选择支持 ' + countries[a].name);
      else if (side === 'defender') toast('你选择支持 ' + countries[d].name);
      else toast('你选择保持中立');
      break;
    }
  }
  closeWarDecl();
}

/* ── 退出战争功能 ── */
function exitWar(playerId, enemyId) {
  if (!atWar[playerId] || !atWar[playerId][enemyId]) return;
  atWar[playerId][enemyId] = atWar[enemyId][playerId] = false;
  setRel(playerId, enemyId, Math.max((relations[playerId][enemyId] || 0), -15));
  if (playerId === window.playerId) {
    toast('你退出了与 ' + countries[enemyId].name + ' 的战争');
  } else {
    toast(countries[playerId].name + ' 退出了与 ' + countries[enemyId].name + ' 的战争');
  }
}

function closeWarDecl() {
  var m = document.getElementById('war-decl');
  if (m) { m.style.display = 'none'; var ov=document.getElementById('war-decl-overlay'); if(ov) ov.style.display='none'; }
  // 同时也能通过ESC关闭
  document.addEventListener('keydown', closeWarEsc, { once: true });
}
function closeWarEsc(e) {
  if (e.key === 'Escape') {
    closeWarDecl();
    document.removeEventListener('keydown', closeWarEsc);
  }
}

/* 弹窗：正式宣战 */
function showWarLaunched(a, d, pw) {
  var aCol = 'rgb(' + countries[a].color.join(',') + ')';
  var dCol = 'rgb(' + countries[d].color.join(',') + ')';
  var h = '<div class="war-decl" style="min-width:380px;max-width:480px">';
  h += '<div style="font-size:15px;color:#ff8a8a;border-bottom:1px solid rgba(255,120,120,.35);padding-bottom:10px;margin-bottom:14px;letter-spacing:4px;text-align:center">';
  h += '⚔ 战 争 爆 发 ⚔';
  h += '</div>';
  h += '<div style="display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px">';
  h += '<div style="text-align:center"><div style="color:' + aCol + ';font-size:17px;font-weight:600">' + countries[a].name + '</div></div>';
  h += '<div style="color:#ff8a8a;font-size:22px;font-weight:700">⚔</div>';
  h += '<div style="text-align:center"><div style="color:' + dCol + ';font-size:17px;font-weight:600">' + countries[d].name + '</div></div>';
  h += '</div>';
  h += '<div style="text-align:center;color:#9ab3cc;font-size:12px;margin-bottom:14px">战争已经打响！营队正在集结开往前线……</div>';
  if (pw && pw.playerSide !== 'neutral' && pw.playerSide) {
    h += '<div style="text-align:center;color:#ffce7a;font-size:12px;margin-bottom:14px">你选择了' + (pw.playerSide === 'attacker' ? '进攻方' : '防御方') + '阵营</div>';
  }
  h += '<button class="btn" onclick="closeWarDecl()">确认</button>';
  h += '</div>';
  openModal('war-decl', h);
}

/* 弹窗基础设施 */
function openModal(id, html) {
  var m = document.getElementById(id);
  if (!m) {
    m = document.createElement('div');
    m.id = id;
    m.className = 'modal';
    m.style.cssText = 'position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center';
    document.body.appendChild(m);
  }
  m.innerHTML = '<div class="modal-box" style="pointer-events:auto">' + html + '</div>';
  m.style.display = 'flex';
}

/* 玩家参战时右下角战争数据面板 */
function updatePlayerWarPanel() {
  var panel = document.getElementById('player-war-panel');
  var activeWars = [];
  for (var i = 1; i < countries.length; i++) {
    if (!countries[i].alive) continue;
    if (atWar[playerId] && atWar[playerId][i]) activeWars.push(i);
  }
  if (activeWars.length === 0) {
    if (panel) panel.style.display = 'none';
    return;
  }
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'player-war-panel';
    panel.style.cssText = 'position:fixed;bottom:60px;right:12px;z-index:10;background:rgba(20,26,36,.94);border:1px solid rgba(255,120,120,.3);border-radius:8px;padding:10px 14px;font-size:12px;box-shadow:0 4px 20px rgba(0,0,0,.6);min-width:200px;max-width:280px;max-height:200px;overflow-y:auto';
    document.body.appendChild(panel);
  }
  var h = '<div style="color:#ff8a8a;font-weight:600;margin-bottom:6px;letter-spacing:1px">⚔ 你的战争</div>';
  for (var wi = 0; wi < activeWars.length; wi++) {
    var enemy = activeWars[wi];
    var key = Math.min(playerId,enemy) + '_' + Math.max(playerId,enemy);
    var stat = warStats[key];
    var ws = warScore[playerId] ? warScore[playerId][enemy] : 0;
    h += '<div style="display:flex;justify-content:space-between;margin-bottom:4px;color:#dfe8f3">';
    h += '<span>' + countries[enemy].name + '</span>';
    h += '<span style="color:' + (ws >= 0 ? '#7ee0a0' : '#ff8a8a') + '">分:' + Math.round(ws) + '</span>';
    h += '</div>';
    if (stat) {
      h += '<div style="color:#7d8fa6;font-size:11px;padding-left:6px">';
      h += '领土差:' + ((landCount[playerId]||0) - (landCount[enemy]||0));
      h += ' · 我方损失:' + Math.round(playerId < enemy ? stat.lossesA : stat.lossesD);
      h += '</div>';
    }
    /* 退出战争按钮 */
    h += '<button class="btn warn" style="margin-top:4px;font-size:11px;padding:4px 8px" onclick="exitWar(' + playerId + ',' + enemy + ')">退出战争</button>';
  }
  panel.innerHTML = h;
  panel.style.display = 'block';
}

/* ══════════════════════════════════════════════
   本局历史统计
══════════════════════════════════════════════ */
function recordHistory() {
  recountLand();
  var snap = {
    turn: turn,
    day: Math.floor(turn / 14) + 1,
    pop: new Array(countries.length),
    troop: new Array(countries.length),
    land: new Array(countries.length),
    prov: new Array(countries.length)
  };
  var pSum = new Array(countries.length),
      gSum = new Array(countries.length);
  for (var i = 0; i < TOTAL; i++) {
    var o = owner[i];
    if (o === 0) continue;
    pSum[o] = (pSum[o] || 0) + pop[i];
    gSum[o] = (gSum[o] || 0) + troops[i];
  }
  var pv = {};
  for (var pi = 0; pi < provinces.length; pi++)
    pv[provinces[pi].owner] = (pv[provinces[pi].owner] || 0) + 1;
  for (var c2 = 0; c2 < countries.length; c2++) {
    snap.pop[c2]   = Math.round(pSum[c2] || 0);
    snap.troop[c2] = Math.round(gSum[c2] || 0);
    snap.land[c2]  = landCount[c2] || 0;
    snap.prov[c2]  = pv[c2] || 0;
  }
  history.push(snap);
  if (history.length > 600) history.shift();
}

/* ══════════════════════════════════════════════
   核打击
══════════════════════════════════════════════ */
function launchMissile(tx, ty) {
  var sx = WORLD/2, sy = WORLD/2;
  var best = -1, bestPop = 0;
  for (var i = 0; i < TOTAL; i++) {
    if (owner[i] === playerId && pop[i] > bestPop) { bestPop = pop[i]; best = i; }
  }
  if (best >= 0) {
    sx = (best % N + 0.5) * CELL;
    sy = ((best / N | 0) + 0.5) * CELL;
  }
  missiles.push({ sx: sx, sy: sy, tx: tx, ty: ty, t: 0, dur: 1400 });
}

function explode(tx, ty) {
  var R = Math.max(900, CELL * 9);
  var R2 = R * R;

  var gx0 = Math.max(0, Math.floor((tx - R) / CELL));
  var gx1 = Math.min(N-1, Math.ceil((tx + R) / CELL));
  var gy0 = Math.max(0, Math.floor((ty - R) / CELL));
  var gy1 = Math.min(N-1, Math.ceil((ty + R) / CELL));

  for (var gy = gy0; gy <= gy1; gy++) {
    for (var gx = gx0; gx <= gx1; gx++) {
      var cx = (gx + 0.5) * CELL, cy = (gy + 0.5) * CELL;
      var dx = cx - tx, dy = cy - ty;
      var d2 = dx*dx + dy*dy;
      if (d2 > R2) continue;
      var i = gy*N + gx;
      var fall = 1 - Math.sqrt(d2) / R;
      troops[i] = 0;
      pop[i] *= (1 - 0.85 * fall);
      if (terrain[i] !== T_WATER) {
        terrain[i] = T_RUIN;
        ruinTurn[i] = turn;   /* 记录废墟起始回合，到点复原 */
      }
    }
  }

  for (var k = barracks.length - 1; k >= 0; k--) {
    var b = barracks[k];
    var bx = b.cx*CELL - tx, by = b.cy*CELL - ty;
    if (bx*bx + by*by < R2) barracks.splice(k, 1);
  }
  for (var k2 = squads.length - 1; k2 >= 0; k2--) {
    var s2 = squads[k2];
    var sc = squadCell(s2);
    var sx2 = (sc % N) * CELL - tx, sy2 = ((sc / N) | 0) * CELL - ty;
    if (sx2*sx2 + sy2*sy2 < R2) squads.splice(k2, 1);
  }

  effects.push({ type:'nuke', x:tx, y:ty, t:0, dur:1700, r:R });
  miniDirty = true;
}

function addRing(x, y, color, dur) {
  effects.push({ type:'ring', x: x, y: y, t:0, dur: dur || 460, color: color });
}

/* ══════════════════════════════════════════════
   胜负
══════════════════════════════════════════════ */
function checkEnd() {
  if (gameOver) return;
  var mine = 0, enemies = 0;
  var alive = new Uint8Array(countries.length);
  for (var i = 0; i < TOTAL; i++) {
    var o = owner[i];
    if (o === playerId) mine++;
    else if (o !== 0) alive[o] = 1;
  }
  for (var f = 2; f < countries.length; f++) if (alive[f]) enemies++;

  if (mine === 0) {
    gameOver = 'lose';
    showOver('亡　国', '你的所有领土均已失守。', '#ff6b6b');
  } else if (enemies === 0) {
    gameOver = 'win';
    showOver('天 下 一 统', '所有敌对势力已被消灭。', '#6fc0ff');
  }
}

/* ══════════════════════════════════════════════
   渲染 —— 带严格守卫
══════════════════════════════════════════════ */
function render() {
  /* 清屏 */
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, VW, VH);

  /* 没有数据时直接返回（保留黑屏） */
  if (!terrain || !owner || !cap || !countries.length) return;

  var z = cam.zoom;
  if (!(z > 0) || !isFinite(z)) z = cam.zoom = 0.25;

  var cs = CELL * z;

  if (cs < 5.5) {
    renderCached(z);
  } else {
    renderDirect(z, cs);
  }

  /* 选中框 */
  if (selected >= 0 && selected < TOTAL && owner[selected] === playerId) {
    var sgx = selected % N, sgy = (selected / N) | 0;
    var spx = (sgx * CELL - cam.x) * z + VW/2;
    var spy = (sgy * CELL - cam.y) * z + VH/2;
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.lineWidth = 2;
    ctx.strokeRect(spx + 1, spy + 1, Math.max(2, cs - 2), Math.max(2, cs - 2));
  }

  renderBattalions(z);
  renderFlags(z);
  renderAlliances(z, cs);
  renderCities(z, cs);
  renderMissiles(z);
  renderEffects(z);
  renderDivisions(z);   /* 师图层最顶层（地图之上） */

  if (missileMode) renderAim(z);
}

function renderCached(z) {
  if (!mini) return;
  refreshMini();
  var scale = CELL * z;
  if (!(scale > 0)) return;
  var w = VW / scale, h = VH / scale;
  var cx = cam.x / CELL, cy = cam.y / CELL;
  var sx = cx - w/2, sy = cy - h/2;

  ctx.imageSmoothingEnabled = true;
  try {
    ctx.drawImage(mini, sx, sy, w, h, 0, 0, VW, VH);
  } catch (e) {
    /* 忽略 — 极端缩放下的裁剪错误 */
  }
}

function renderDirect(z, cs) {
  var halfW = VW / (2*z), halfH = VH / (2*z);
  if (!isFinite(halfW) || !isFinite(halfH)) return;

  var gx0 = Math.max(0, Math.floor((cam.x - halfW) / CELL));
  var gx1 = Math.min(N-1, Math.ceil((cam.x + halfW) / CELL));
  var gy0 = Math.max(0, Math.floor((cam.y - halfH) / CELL));
  var gy1 = Math.min(N-1, Math.ceil((cam.y + halfH) / CELL));

  if (gx0 > gx1 || gy0 > gy1) return;

  /* 地块 */
  var px0 = VW/2 - cam.x * z;
  var py0 = VH/2 - cam.y * z;
  var sz = cs + 0.6;

  for (var gy = gy0; gy <= gy1; gy++) {
    var py = gy * CELL * z + py0;
    var rowBase = gy * N;
    for (var gx = gx0; gx <= gx1; gx++) {
      var i = rowBase + gx;
      var oi = owner[i];
      var ti = terrain[i];
      var c = cap[i] || 1;
      var l = (troops[i] / c * 4) | 0;
      if (l > 3) l = 3; else if (l < 0) l = 0;
      ctx.fillStyle = COLOR_CSS[oi][ti][l];
      ctx.fillRect(gx * CELL * z + px0, py, sz, sz);
    }
  }

  /* 国界 */
  if (cs > 6) {
    ctx.lineWidth = Math.max(1, cs * 0.055);
    ctx.strokeStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath();
    for (var gy2 = gy0; gy2 <= gy1; gy2++) {
      var py2 = gy2 * CELL * z + py0;
      var rb = gy2 * N;
      for (var gx2 = gx0; gx2 <= gx1; gx2++) {
        var i2 = rb + gx2;
        var o2 = owner[i2];
        var px2 = gx2 * CELL * z + px0;
        if (gx2 === 0 || owner[i2-1] !== o2) {
          ctx.moveTo(px2, py2); ctx.lineTo(px2, py2 + cs);
        }
        if (gy2 === 0 || owner[i2-N] !== o2) {
          ctx.moveTo(px2, py2); ctx.lineTo(px2 + cs, py2);
        }
      }
    }
    ctx.stroke();
  }

  /* 省/市边界：放大时（cs > 11）才绘制；仅在同一国家内部绘制，
     按省分色描边，避免与国界重叠造成杂乱 */
  if (cs > 11 && prov) {
    ctx.lineWidth = Math.max(1, cs * 0.035);
    var drawnSeg = 0;
    for (var gy3 = gy0; gy3 <= gy1; gy3++) {
      var py3 = gy3 * CELL * z + py0;
      var rb3 = gy3 * N;
      for (var gx3 = gx0; gx3 <= gx1; gx3++) {
        var i3 = rb3 + gx3;
        var o3 = owner[i3];
        var p3 = prov[i3];
        if (p3 < 0) continue;
        var px3 = gx3 * CELL * z + px0;
        /* 右邻：同国家、不同省 → 画省界 */
        if (gx3 < N-1) {
          var ir = i3 + 1;
          if (owner[ir] === o3 && o3 > 0 && prov[ir] !== p3) {
            ctx.strokeStyle = PROV_EDGE[p3 % PROV_EDGE.length];
            ctx.beginPath();
            ctx.moveTo(px3 + cs, py3); ctx.lineTo(px3 + cs, py3 + cs);
            ctx.stroke(); drawnSeg++;
          }
        }
        /* 下邻：同国家、不同省 → 画省界 */
        if (gy3 < N-1) {
          var id = i3 + N;
          if (owner[id] === o3 && o3 > 0 && prov[id] !== p3) {
            ctx.strokeStyle = PROV_EDGE[p3 % PROV_EDGE.length];
            ctx.beginPath();
            ctx.moveTo(px3, py3 + cs); ctx.lineTo(px3 + cs, py3 + cs);
            ctx.stroke(); drawnSeg++;
          }
        }
      }
    }
  }
}

function fmtMan(v) {
  v = Math.round(v);
  if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
  return String(v);
}
function renderBattalions(z) {
  var cs = CELL * z;

  /* 静态军营：国家色方块 + emoji 图标 + 人力数字 */
  for (var k = 0; k < barracks.length; k++) {
    var b = barracks[k];
    if (b.x != null) continue;
    var px = (b.cx * CELL - cam.x) * z + VW/2;
    var py = (b.cy * CELL - cam.y) * z + VH/2;
    if (px < -60 || py < -60 || px > VW + 60 || py > VH + 60) continue;

    var s = Math.max(6, cs * 0.62);
    var col = countries[b.owner].color;

    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(px - s/2 + 1.5, py - s/2 + 1.5, s, s);
    ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',.85)';
    ctx.fillRect(px - s/2, py - s/2, s, s);
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1;
    ctx.strokeRect(px - s/2, py - s/2, s, s);

    /* emoji 图标：type 区分建筑类型 */
    if (cs > 9) {
      var icon = '⛺';
      if (b.type === 'large') icon = '🎪';
      else if (b.type === 'training') icon = '🏋';
      ctx.font = Math.max(9, Math.min(18, cs * 0.6)) + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(icon, px, py);
      ctx.textBaseline = 'alphabetic';
    } else if (cs > 5) {
      /* 小一点也给简单文字标识 */
      ctx.fillStyle = '#fff';
      ctx.font = Math.min(10, cs*0.7) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(fmtMan(b.manpower), px, py);
      ctx.textBaseline = 'alphabetic';
    }
  }

  /* 行军营队：0.8×0.8 方块，显示兵力 + 编号 + 质量（放大时） */
  for (var q = 0; q < squads.length; q++) {
    var s2 = squads[q];
    var ci = squadCell(s2);
    var qx = ci % N, qy = (ci / N) | 0;
    var qpx = ((qx + 0.5) * CELL - cam.x) * z + VW/2;
    var qpy = ((qy + 0.5) * CELL - cam.y) * z + VH/2;
    if (qpx < -40 || qpy < -40 || qpx > VW + 40 || qpy > VH + 40) continue;

    var qs = Math.max(4, cs * 0.8);
    var qcol = countries[s2.owner].color;

    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.fillRect(qpx - qs/2 + 1, qpy - qs/2 + 1, qs, qs);

    /* 根据质量改变亮度（质量越高越亮） */
    var qq = (s2.quality != null ? s2.quality : 0.5);
    var bright = 0.6 + qq * 0.4;
    ctx.fillStyle = 'rgba(' + Math.min(255, Math.floor(qcol[0] * bright)) + ',' +
      Math.min(255, Math.floor(qcol[1] * bright)) + ',' +
      Math.min(255, Math.floor(qcol[2] * bright)) + ',.85)';
    ctx.fillRect(qpx - qs/2, qpy - qs/2, qs, qs);

    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1;
    ctx.strokeRect(qpx - qs/2, qpy - qs/2, qs, qs);

    if (cs > 8) {
      ctx.fillStyle = '#fff';
      ctx.font = Math.min(9, cs*0.5) + 'px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      /* 兵力在方块上方 */
      ctx.fillText(fmtMan(s2.troops), qpx, qpy - qs/2 - 2);
    }
    if (cs > 14 && s2.id != null) {
      /* 放大到足够大时显示营队编号 */
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.font = Math.min(7, cs*0.35) + 'px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('#' + s2.id, qpx, qpy);
      ctx.textBaseline = 'alphabetic';
    }
  }
}

/* 师旗帜渲染：showDivisions 开启就显示，缩到全图时也能看到小图标 */
function renderDivisions(z) {
  if (!showDivisions) return;
  var cs = CELL * z;
  if (cs < 2) return;   /* 缩到比 2px 还小就不画了（根本看不到） */
  var iconSize;          /* 根据缩放动态选师图标大小 */
  if (cs > 20) iconSize = Math.max(10, cs * 0.45);      /* 放大时：较大 */
  else if (cs > 6) iconSize = Math.max(8, cs * 0.35);   /* 中等：适中 */
  else iconSize = Math.max(4, cs * 0.5);               /* 缩小时：相对更大 */

  for (var d = 0; d < divisions.length; d++) {
    var div = divisions[d];
    var px = (div.cx + 0.5) * CELL - cam.x; px *= z; px += VW/2;
    var py = (div.cy + 0.5) * CELL - cam.y; py *= z; py += VH/2;
    if (px < -40 || py < -40 || px > VW + 40 || py > VH + 40) continue;

    var size = iconSize;
    /* 阴影 */
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(px - size/2 + 1, py - size/2 + 1, size, size);

    var col = countries[div.owner].color;
    /* 师方块底色（国家色） */
    ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',.95)';
    ctx.fillRect(px - size/2, py - size/2, size, size);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = Math.max(0.5, size * 0.1);
    ctx.strokeRect(px - size/2, py - size/2, size, size);

    /* 师编号（缩到够大才显示） */
    if (size > 10) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.max(7, Math.min(size * 0.7, 14)) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(div.id), px, py);
      ctx.textBaseline = 'alphabetic';
    }

    /* 师 ≥20 营队时绘制师旗帜 canvas */
    if (div.flagCanvas && size > 6) {
      var fs = Math.max(6, size * 1.2);
      ctx.drawImage(div.flagCanvas, px + size*0.5 + 2, py - fs/2, fs, fs);
    }

    /* 放大时显示师规模 */
    if (cs > 18) {
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.font = Math.min(9, cs*0.35) + 'px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(div.squads.length + '/20', px, py + size/2 + 10);
    }
  }
}

function renderMissiles(z) {
  for (var k = 0; k < missiles.length; k++) {
    var m = missiles[k];
    var p = Math.min(1, m.t / m.dur);
    var ax = (m.sx - cam.x) * z + VW/2;
    var ay = (m.sy - cam.y) * z + VH/2;
    var bx = (m.tx - cam.x) * z + VW/2;
    var by = (m.ty - cam.y) * z + VH/2;

    ctx.strokeStyle = 'rgba(255,120,70,.26)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();

    var arc = Math.sin(p * Math.PI) * Math.min(VH * 0.6, 340);
    var hx = ax + (bx - ax) * p;
    var hy = ay + (by - ay) * p - arc;

    ctx.fillStyle = 'rgba(255,200,130,.32)';
    ctx.beginPath(); ctx.arc(hx, hy, 13, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#ffb060';
    ctx.beginPath(); ctx.arc(hx, hy, 5, 0, Math.PI*2); ctx.fill();
  }
}

function renderEffects(z) {
  for (var k = 0; k < effects.length; k++) {
    var e = effects[k];
    var px = (e.x - cam.x) * z + VW/2;
    var py = (e.y - cam.y) * z + VH/2;

    if (e.type === 'nuke') {
      var p = e.t / e.dur;

      if (p < 0.16) {
        ctx.globalAlpha = (0.16 - p) / 0.16 * 0.92;
        ctx.fillStyle = '#fff8e8';
        ctx.beginPath();
        ctx.arc(px, py, e.r * z * (0.5 + p * 5), 0, Math.PI*2);
        ctx.fill();
      }

      var rr = e.r * z * (0.25 + p * 1.25);
      ctx.globalAlpha = (1 - p) * 0.85;
      ctx.strokeStyle = '#ff9a4a';
      ctx.lineWidth = 4 * (1 - p) + 1;
      ctx.beginPath(); ctx.arc(px, py, Math.max(1, rr), 0, Math.PI*2); ctx.stroke();

      ctx.globalAlpha = (1 - p) * 0.45;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2 * (1 - p) + 0.6;
      ctx.beginPath(); ctx.arc(px, py, Math.max(1, rr * 0.66), 0, Math.PI*2); ctx.stroke();

      ctx.globalAlpha = 1;
    } else {
      var p2 = e.t / e.dur;
      ctx.globalAlpha = (1 - p2) * 0.9;
      ctx.strokeStyle = 'rgb(' + e.color[0] + ',' + e.color[1] + ',' + e.color[2] + ')';
      ctx.lineWidth = 2.2 * (1 - p2) + 0.6;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(1, CELL * z * (0.45 + p2 * 1.7)), 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

var mouseWX = 0, mouseWY = 0;

function renderAim(z) {
  var gx = Math.floor(mouseWX / CELL), gy = Math.floor(mouseWY / CELL);
  
  var px = (gx * CELL - cam.x) * z + VW/2;
  var py = (gy * CELL - cam.y) * z + VH/2;
  var cs = CELL * z;

  ctx.strokeStyle = 'rgba(255,120,80,.85)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.arc(px + cs/2, py + cs/2, Math.max(900, CELL*9) * z, 0, Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px + cs/2 - 14, py + cs/2); ctx.lineTo(px + cs/2 + 14, py + cs/2);
  ctx.moveTo(px + cs/2, py + cs/2 - 14); ctx.lineTo(px + cs/2, py + cs/2 + 14);
  ctx.stroke();
}

/* ══════════════════════════════════════════════
   主循环 + FPS
══════════════════════════════════════════════ */
var lastT = performance.now();
var acc = 0, hudTimer = 0;

var fpsEl = document.getElementById('fps');
var fpsAcc = 0, fpsFrames = 0, fpsMin = 999, fpsMax = 0;

function loop(now) {
  var dt = now - lastT;
  if (!isFinite(dt) || dt < 0) dt = 16;
  if (dt > 100) dt = 100;
  lastT = now;

  /* ── FPS 统计 ── */
  fpsAcc += dt;
  fpsFrames++;
  if (fpsAcc >= 500) {
    var fps = Math.round(fpsFrames * 1000 / fpsAcc);
    if (fps < fpsMin) fpsMin = fps;
    if (fps > fpsMax) fpsMax = fps;
    fpsEl.innerHTML = '<b>' + fps + '</b> FPS · ' + fpsFrames + '帧 · dt ' +
      (fpsAcc/fpsFrames).toFixed(1) + 'ms · ' +
      (terrain ? (N + '×' + N) : '---');
    fpsAcc = 0; fpsFrames = 0;
  }

  /* ── 回合推进 ── */
  acc += dt;
  var guard = 0;
  var step = (TOTAL > 400000) ? TICK_MS * 2 : TICK_MS;
  while (acc >= step * gameSpeed && guard++ < 5) {
    if (!gameOver && terrain) {
      try { tick(); } catch (err) { console.error('tick error:', err); }
    }
    acc -= step * gameSpeed;
  }

  /* ── 特效 ── */
  for (var i = effects.length - 1; i >= 0; i--) {
    effects[i].t += dt;
    if (effects[i].t >= effects[i].dur) effects.splice(i, 1);
  }
  for (var j = missiles.length - 1; j >= 0; j--) {
    var m = missiles[j];
    m.t += dt;
    if (m.t >= m.dur) {
      try { explode(m.tx, m.ty); } catch (e) { console.error('explode error:', e); }
      missiles.splice(j, 1);
    }
  }

  /* ── 渲染 ── */
  try { render(); } catch (err) { console.error('render error:', err); }

  /* ── HUD ── */
  hudTimer += dt;
  if (hudTimer > 220) {
    hudTimer = 0;
    try { updateHUD(); updatePanel(); } catch (e) { console.error('hud error:', e); }
  }

  requestAnimationFrame(loop);
}

function updateRankbar() {
  if (!rkList || !owner) return;
  var key = RANK_KEYS[rankingType];

  /* 收集所有存活国家数据 */
  var arr = [];
  for (var ci = 1; ci < countries.length; ci++) {
    if (!countries[ci].alive) continue;
    var val = 0;
    if (key === 'land') {
      val = landCount[ci] || 0;
    } else if (key === 'pop') {
      for (var i = 0; i < TOTAL; i++)
        if (owner[i] === ci) val += pop[i];
    } else if (key === 'active') {
      for (var s = 0; s < squads.length; s++)
        if (squads[s].owner === ci) val += squads[s].troops;
    } else if (key === 'squad') {
      for (var s2 = 0; s2 < squads.length; s2++)
        if (squads[s2].owner === ci) val++;
    } else if (key === 'city') {
      val = 0;
      for (var c3 = 0; c3 < cities.length; c3++)
        if (cities[c3].owner === ci) val++;
    }
    arr.push({ id: ci, name: countries[ci].name, color: countries[ci].color, val: Math.round(val) });
  }
  arr.sort(function (a, b) { return b.val - a.val; });

  rkTitle.textContent = RANK_TITLES[rankingType];
  var html = '';
  var max = Math.max(1, arr[0] ? arr[0].val : 1);
  for (var r = 0; r < Math.min(5, arr.length); r++) {
    var item = arr[r];

    html += '<span class="rk-flag" style="' + flag + '"></span>';
    html += '<span>' + item.name + '</span>';
    html += '<b>' + item.val.toLocaleString() + '</b>';
    html += '</span>';
  }
  rkList.innerHTML = html;
}

btnRec.addEventListener('click', function () {
  if (gameOver || selected < 0) return;
  if (owner[selected] !== playerId) { toast('只能在自己的领土征兵'); return; }
  if (pop[selected] < 800) { toast('该地块人口不足'); return; }
  if (troops[selected] >= cap[selected] * 2) { toast('兵力已达上限'); return; }

  pop[selected] -= 800;
  troops[selected] += 1000;
  miniDirty = true;
  updatePanel();
});

btnBat.addEventListener('click', function () {
  if (gameOver || selected < 0) return;
  if (owner[selected] !== playerId) { toast('只能在自己的领土建造'); return; }

  var x = selected % N, y = (selected / N) | 0;
  if (!canPlaceBattalion(x, y, playerId)) {
    toast('需要 3×3 的己方连续领土，且不能与其他军帐重叠');
    return;
  }

  var total = 0;
  for (var dy = -1; dy <= 1; dy++)
    for (var dx = -1; dx <= 1; dx++)
      total += troops[WCell(x+dx, y+dy)];

  if (total < 1000) { toast('该区域兵力不足 1000'); return; }

  for (var dy2 = -1; dy2 <= 1; dy2++)
    for (var dx2 = -1; dx2 <= 1; dx2++) {
      var ni = (y+dy2)*N + (x+dx2);
      troops[ni] -= troops[ni] / total * 1000;
    }

  var man = 0;
  for (var d3 = -1; d3 <= 1; d3++)
    for (var d4 = -1; d4 <= 1; d4++)
      man += troops[(y+d3)*N + (x+d4)];
  barracks.push({
    owner: playerId,
    cx: x, cy: y, cell: y * N + x,
    manpower: man, storedManpower: 0, maxSquads: 25
  });

  addRing((x + 0.5) * CELL, (y + 0.5) * CELL, countries[playerId].color, 500);
  toast('军帐已建立 — 会自动向外派生营队');
  miniDirty = true;
  updatePanel();
});

/* ══════════════════════════════════════════════
   国家查询弹窗（右键领土）+ 折线统计图
══════════════════════════════════════════════ */
var cqueryEl = document.getElementById('cquery');
var cqBody = document.getElementById('cq-body');

function fmtNum(v) {
  v = Math.round(v);
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'k';
  return String(v);
}

function drawLineChart(canvas, data, color) {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = canvas.clientWidth || 460, h = canvas.clientHeight || 120;
  canvas.width = w * dpr; canvas.height = h * dpr;
  var cx = canvas.getContext('2d');
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, w, h);

  var pad = { l: 10, r: 10, t: 10, b: 18 };
  var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;

  var maxV = 1;
  for (var i = 0; i < data.length; i++) if (data[i] > maxV) maxV = data[i];

  cx.strokeStyle = 'rgba(90,140,200,.25)';
  cx.lineWidth = 1;
  cx.beginPath();
  for (var g = 0; g <= 4; g++) {
    var gy = pad.t + ih * g / 4;
    cx.moveTo(pad.l, gy); cx.lineTo(w - pad.r, gy);
  }
  cx.stroke();

  if (data.length < 2) {
    cx.fillStyle = '#5c6b7d';
    cx.font = '12px -apple-system,sans-serif';
    cx.textAlign = 'center';
    cx.fillText('数据不足', w / 2, h / 2);
    return;
  }

  /* 面积 */
  cx.beginPath();
  cx.moveTo(pad.l, pad.t + ih);
  for (var j = 0; j < data.length; j++) {
    var x = pad.l + iw * j / (data.length - 1);
    var y = pad.t + ih * (1 - data[j] / maxV);
    cx.lineTo(x, y);
  }
  cx.lineTo(w - pad.r, pad.t + ih);
  cx.closePath();
  cx.fillStyle = 'rgba(143,201,255,.12)';
  cx.fill();

  /* 曲线 */
  cx.beginPath();
  cx.strokeStyle = color;
  cx.lineWidth = 1.8;
  for (var k = 0; k < data.length; k++) {
    var xx = pad.l + iw * k / (data.length - 1);
    var yy = pad.t + ih * (1 - data[k] / maxV);
    if (k === 0) cx.moveTo(xx, yy); else cx.lineTo(xx, yy);
  }
  cx.stroke();

  cx.fillStyle = '#5f7085';
  cx.font = '10px -apple-system,sans-serif';
  cx.textAlign = 'left';
  cx.fillText('峰值 ' + fmtNum(maxV), pad.l, h - 5);
  cx.textAlign = 'right';
  cx.fillText('末值 ' + fmtNum(data[data.length - 1]), w - pad.r, h - 5);
}

    '<canvas class="cq-chart" id="cq-c-troop"></canvas>' +

    '<canvas class="cq-chart" id="cq-c-land"></canvas>';

  cqueryEl.style.display = 'flex';

function buildDiploPanel() {
  diploList.innerHTML = '';
  if (!countries.length) return;

  for (var i = 1; i < countries.length; i++) {
    if (i === playerId) continue;
    var c = countries[i];
    if (!c.alive) continue;

    var rel = relations[playerId][i];
    var war = atWar[playerId][i];
    var ally = allied[playerId][i];

    var state, stateColor;
    if (war) { state = '战争'; stateColor = '#ff6b6b'; }
    else if (ally) { state = '同盟'; stateColor = '#6fc0ff'; }
    else if (rel > 40) { state = '友好'; stateColor = '#7ee0a0'; }
    else if (rel < -20) { state = '冷淡'; stateColor = '#d0a060'; }
    else { state = '和平'; stateColor = '#8fa8c4'; }

    var row = document.createElement('div');
    row.className = 'diplo-row';

    var btnHtml = '';
    if (war) {
      btnHtml += '<button data-act="peace" data-id="' + i + '">求和</button>';
    } else {
      btnHtml += '<button data-act="war" data-id="' + i + '">宣战</button>';
    }
    if (!war && !ally && rel > 55) {
      btnHtml += '<button data-act="ally" data-id="' + i + '">结盟</button>';
    }
    btnHtml += '<button data-act="gift" data-id="' + i + '">赠礼</button>';

    row.innerHTML =
      '<div class="dr-color" style="background:rgb(' + c.color.join(',') + ')"></div>' +
      '<div class="dr-name">' + c.name + '</div>' +
      '<div class="dr-stat">' +
        '<span style="color:' + stateColor + '">' + state + '</span>' +
        '<span>关系 ' + Math.round(rel) + '</span>' +
        '<span>领土 ' + (landCount[i] || 0) + '</span>' +
      '</div>' +
      '<div class="dr-acts">' + btnHtml + '</div>';
    diploList.appendChild(row);
  }

  if (!diploList.children.length) {
    diploList.innerHTML = '<div style="text-align:center;color:#5c6b7d;padding:24px">暂无其他国家</div>';
  }
}

diploList.addEventListener('click', function (e) {
  var btn = e.target.closest ? e.target.closest('button') : null;
  if (!btn) return;
  var id = +btn.dataset.id;
  var act = btn.dataset.act;

  if (act === 'war') {
    pushPendingWar(playerId, id);
    diploEl.style.display = 'none';
  }
  else if (act === 'peace') {
    var rel = relations[playerId][id];
    var myPower = landCount[playerId] || 1;
    var theirPower = landCount[id] || 1;
    /* 求和接受逻辑：势均力敌必然接受；略有优势接受；极度劣势则拒绝 */
    var accept;
    if (myPower > theirPower * 0.92) accept = true;
    else if (myPower > theirPower * 0.6) accept = rel > -25;
    else if (rel > 10) accept = Math.random() < 0.35;
    else accept = false;

    if (accept) {
      atWar[playerId][id] = atWar[id][playerId] = false;
      setRel(playerId, id, Math.max(rel, -18));
      toast(countries[id].name + ' 接受了和平');
    } else {
      addRel(playerId, id, -5);
      toast(countries[id].name + ' 拒绝了你的求和');
    }
  }
  else if (act === 'ally') {
    var rel2 = relations[playerId][id];
    var accept2 = rel2 > 65 && !atWar[playerId][id];
    if (accept2) {
      allied[playerId][id] = allied[id][playerId] = true;
      addRel(playerId, id, 10);
      toast('与 ' + countries[id].name + ' 结为同盟');
    } else {
      toast(countries[id].name + ' 拒绝了结盟');
    }
  }
  else if (act === 'gift') {
    var myCells = [];
    for (var i = 0; i < TOTAL; i++)
      if (owner[i] === playerId && troops[i] > 40) myCells.push(i);
    if (myCells.length === 0) { toast('没有可调动的兵力'); return; }

    var totalG = 0;
    for (var k = 0; k < myCells.length; k++)
      totalG += Math.min(troops[myCells[k]], 200);
    if (totalG < 800) { toast('兵力不足 800'); return; }

    var taken = 0;
    for (var j = 0; j < myCells.length; j++) {
      var cell = myCells[j];
      var t = Math.min(troops[cell] - 20, (800 - taken) * (Math.min(troops[cell], 200) / totalG) + 1);
      if (t > 0) { troops[cell] -= t; taken += t; }
      if (taken >= 800) break;
    }

    addRel(playerId, id, 22);
    toast('向 ' + countries[id].name + ' 赠送了 800 兵力');
  }

  buildDiploPanel();
  updateHUD();
});

/* ══════════════════════════════════════════════
   鼠标 / 相机
══════════════════════════════════════════════ */
var dragging = false, dragSX = 0, dragSY = 0, camSX = 0, camSY = 0, moved = 0;

function screenToWorld(sx, sy) {
  var z = cam.zoom;
  return { x: (sx - VW/2) / z + cam.x, y: (sy - VH/2) / z + cam.y };
}
function worldToCell(wx, wy) {
  var gx = Math.floor(wx / CELL), gy = Math.floor(wy / CELL);
  
  return gy*N + gx;
}

cv.addEventListener('mousedown', function (e) {
  if (e.button !== 0) return;
  dragging = true;
  dragSX = e.clientX; dragSY = e.clientY;
  camSX = cam.x; camSY = cam.y;
  moved = 0;
});

window.addEventListener('mousemove', function (e) {
  var w = screenToWorld(e.clientX, e.clientY);
  mouseWX = w.x; mouseWY = w.y;

  if (dragging) {
    var dx = e.clientX - dragSX, dy = e.clientY - dragSY;
    var d = Math.sqrt(dx*dx + dy*dy);
    if (d > moved) moved = d;
    cam.x = camSX - dx / cam.zoom;
    cam.y = camSY - dy / cam.zoom;
    clampCam();
  }

  var i = worldToCell(mouseWX, mouseWY);
  var tip = document.getElementById('tooltip');
  if (i >= 0 && !gameOver && owner) {
    var o = owner[i];
    var c = countries[o].color;
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 16) + 'px';
    tip.style.top  = (e.clientY + 16) + 'px';

    var stateStr = '';
    if (o !== playerId && o !== 0) {
      if (atWar[playerId][o]) stateStr = ' <span style="color:#ff9d9d">[战争]</span>';
      else if (allied[playerId][o]) stateStr = ' <span style="color:#8fc9ff">[同盟]</span>';
    }

    tip.innerHTML =
      '<span style="color:rgb(' + c.join(',') + ')">■</span> ' + countries[o].name + stateStr + '　' +
      '<span class="t">' + TERRAIN[terrain[i]].name + '</span><br>' +
      '<span class="t">守军</span> <b style="color:#eaf2ff">' + Math.round(troops[i]) + '</b>' +
      '　<span class="t">人口</span> ' + Math.round(pop[i]).toLocaleString();
  } else {
    tip.style.display = 'none';
  }
});

window.addEventListener('mouseup', function (e) {
  if (e.button !== 0) { dragging = false; return; }
  var wasDrag = moved >= 5;
  dragging = false;
  if (wasDrag) return;
  if (gameOver || !terrain) return;

  var w = screenToWorld(e.clientX, e.clientY);
  var i = worldToCell(w.x, w.y);
  if (i < 0) return;

  if (missileMode) {
    if (missileCount <= 0) { toggleMissile(); return; }
    missileCount--;
    launchMissile((i % N + 0.5) * CELL, ((i / N | 0) + 0.5) * CELL);
    missileMode = false;
    cv.style.cursor = 'crosshair';
    toast('DF-5C 已发射');
    updatePanel();
    return;
  }

  selected = i;
  updatePanel();
});

cv.addEventListener('mouseleave', function () {
  dragging = false;
  document.getElementById('tooltip').style.display = 'none';
});

cv.addEventListener('contextmenu', function (e) {
  e.preventDefault();
  if (missileMode) { toggleMissile(); return; }
  if (gameOver || !terrain) return;
  var w = screenToWorld(e.clientX, e.clientY);
  var i = worldToCell(w.x, w.y);
  if (i < 0) return;
  openCQuery(owner[i]);
});

cv.addEventListener('wheel', function (e) {
  e.preventDefault();
  var oldZ = cam.zoom;
  var factor = Math.exp(-e.deltaY * 0.0013);
  var newZ = Math.max(0.04, Math.min(3.0, oldZ * factor));
  if (newZ === oldZ) return;

  var wx = (e.clientX - VW/2) / oldZ + cam.x;
  var wy = (e.clientY - VH/2) / oldZ + cam.y;

  cam.zoom = newZ;
  cam.x = wx - (e.clientX - VW/2) / newZ;
  cam.y = wy - (e.clientY - VH/2) / newZ;
  clampCam();
}, { passive: false });

function clampCam() {
  var m = WORLD * 0.2;
  cam.x = Math.max(-m, Math.min(WORLD + m, cam.x));
  cam.y = Math.max(-m, Math.min(WORLD + m, cam.y));
}

function zoomBy(f) {
  cam.zoom = Math.max(0.04, Math.min(3.0, cam.zoom * f));
  clampCam();
}
document.getElementById('zin').addEventListener('click', function () { zoomBy(1.35); });
document.getElementById('zout').addEventListener('click', function () { zoomBy(1/1.35); });

/* ══════════════════════════════════════════════
   导弹模式
══════════════════════════════════════════════ */
function toggleMissile() {
  if (gameOver) return;
  if (missileCount <= 0) { toast('DF-5C 已耗尽'); return; }
  missileMode = !missileMode;
  toast(missileMode ? '选择核打击目标（左键发射 / 右键取消）' : '已取消导弹打击');
  updatePanel();
}

/* ══════════════════════════════════════════════
   键盘
══════════════════════════════════════════════ */
window.addEventListener('keydown', function (e) {
  /* 方向键不做 toLowerCase（否则 ArrowLeft 变 arrowleft 永远匹配不到） */
  var k = e.key || '';
  if (k === 'ArrowLeft') {
    e.preventDefault();
    rankingType = (rankingType - 1 + RANK_TITLES.length) % RANK_TITLES.length;
    updateRankbar();
    return;
  }
  if (k === 'ArrowRight') {
    e.preventDefault();
    rankingType = (rankingType + 1) % RANK_TITLES.length;
    updateRankbar();
    return;
  }
  k = k.toLowerCase();
  if (k === 'q') { e.preventDefault(); toggleMissile(); }
  else if (k === 'escape') {
    if (missileMode) toggleMissile();
    selected = -1;
    updatePanel();
    diploEl.style.display = 'none';
  }
  else if (k === 'r') {
    document.getElementById('start').style.display = 'flex';
    document.getElementById('over').style.display = 'none';
    diploEl.style.display = 'none';
  }
  else if (k === 'k') {
    showFlags = !showFlags;   /* K 键开关旗帜显示 */
  }
  else if (k === 'z') {
    showDivisions = !showDivisions;  /* Z 键开关师显示 */
  }
  else if (k === '1') {
    showAlliances = !showAlliances;  /* 1 键开关联盟阵营显示 */
    toast('联盟显示: ' + (showAlliances ? '开' : '关'));
  }
  else if (k === 'ArrowLeft') {
    rankingType = (rankingType - 1 + RANK_TITLES.length) % RANK_TITLES.length;
    updateRankbar();
  }
  else if (k === 'ArrowRight') {
    rankingType = (rankingType + 1) % RANK_TITLES.length;
    updateRankbar();
  }
  // X 键：切换开发者模式 / 开发者模式下调速
  else if (k === 'x') {
    isDevMode = !isDevMode;
    if (isDevMode) toast('开发者模式已开启，+/- 调速 0.5x-20x，当前 ' + gameSpeed + 'x');
    else toast('已退出开发者模式');
  }
  else if (isDevMode && (k === '=' || k === '+')) {
    if (performance.now() - lastSpeedChange >= 200) {
      speedIdx = Math.min(SPEED_LEVELS.length - 1, speedIdx + 1);
      gameSpeed = SPEED_LEVELS[speedIdx];
      toast('速度调节：' + gameSpeed + 'x');
      lastSpeedChange = performance.now();
    }
  }
  else if (isDevMode && (k === '-' || k === '_')) {
    if (performance.now() - lastSpeedChange >= 200) {
      speedIdx = Math.max(0, speedIdx - 1);
      gameSpeed = SPEED_LEVELS[speedIdx];
      toast('速度调节：' + gameSpeed + 'x');
      lastSpeedChange = performance.now();
    }
  }
});

/* ══════════════════════════════════════════════
   Toast / 结束界面
══════════════════════════════════════════════ */
var toastEl = document.getElementById('toast');
var toastTimer = null;

function toast(msg) {
  /* 非模态悬浮：多条消息入队，逐条显示，不遮挡、不拦截输入 */
  if (!msg) return;
  if (!document.getElementById('toast-stack')) {
    var stack = document.createElement('div');
    stack.id = 'toast-stack';
    document.body.appendChild(stack);
  }
  var stack = document.getElementById('toast-stack');
  var item = document.createElement('div');
  item.className = 'toast-item';
  item.textContent = msg;
  stack.appendChild(item);
  item.classList.add('on');
  if (stack.children.length > 4) stack.removeChild(stack.firstChild);
  setTimeout(function () {
    if (item.parentNode) item.parentNode.removeChild(item);
  }, 2200);
}

function showOver(title, sub, color) {
  document.getElementById('over-title').textContent = title;
  document.getElementById('over-title').style.color = color;
  document.getElementById('over-sub').textContent = sub;
  document.getElementById('over').style.display = 'flex';
}

/* ══════════════════════════════════════════════
   开始界面
══════════════════════════════════════════════ */
var chosenN = 500;

/* 给 seed-input 自动填入当前随机种子（玩家每次开局都不一样） */
(function initSeedInput() {
  var seedEl = document.getElementById('map-seed');
  if (seedEl) seedEl.value = String(Math.floor(Math.random() * 1e7 + 1));
})();

var mapBtns = document.querySelectorAll('#map-opts button');
for (var mb = 0; mb < mapBtns.length; mb++) {
  mapBtns[mb].addEventListener('click', function () {
    for (var i = 0; i < mapBtns.length; i++) mapBtns[i].classList.remove('active');
    this.classList.add('active');
    chosenN = +this.dataset.n;
  });
}

var aiRange = document.getElementById('ai-count');
var aiVal = document.getElementById('ai-count-v');
aiRange.addEventListener('input', function () { aiVal.textContent = aiRange.value; });

document.getElementById('start-btn').addEventListener('click', function () {
  try {
    var seedEl = document.getElementById('map-seed');
    var seed = seedEl ? seedEl.value.trim() : '';
    newGame(chosenN, +aiRange.value, seed);
  } catch (err) {
    console.error('newGame error:', err);
    alert('开局失败: ' + err.message);
  }
});

document.getElementById('over-btn').addEventListener('click', function () {
  document.getElementById('over').style.display = 'none';
  document.getElementById('start').style.display = 'flex';
});

/* ══════════════════════════════════════════════
   启动
══════════════════════════════════════════════ */
requestAnimationFrame(loop);

/* 暴露给全局：解决 onclick 在 IIFE 外部无法调用 */
window.closeWarDecl = closeWarDecl;
window.alignWar = alignWar;
window.exitWar = exitWar;

})();
